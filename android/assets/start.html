<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>TabDock</title>
<style>
 :root { --bg:#0a0c0f; --panel:#14171c; --panel2:#1b1f26; --line:#262b34; --text:#e9edf2; --muted:#8b94a3; --accent:#4fd1c5; --green:#68d391; --amber:#f6c453; }
 * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
 body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,Roboto,"Segoe UI",sans-serif; display:flex; align-items:center; justify-content:center; }
 .wrap { width:min(880px,92vw); }
 .logo { display:flex; align-items:center; gap:18px; margin-bottom:24px; }
 .logo svg { width:64px; height:64px; } .logo h1 { margin:0; font-size:34px; } .logo p { margin:4px 0 0; color:var(--muted); font-size:17px; }
 .card { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:20px 22px; margin-bottom:18px; }
 h2 { margin:0 0 14px; font-size:13px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:10px; }
 .srv { display:flex; align-items:center; gap:14px; padding:16px; border-radius:14px; background:var(--panel2); margin-bottom:10px; font-size:19px; }
 .srv .n { flex:1; } .srv small { display:block; color:var(--muted); font-size:14px; margin-top:2px; }
 .dot { width:12px; height:12px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green); flex:none; }
 .src { font-size:12px; color:var(--muted); background:var(--bg); padding:3px 8px; border-radius:999px; }
 button, .btn { font:inherit; color:inherit; border:1px solid var(--line); background:var(--panel2); border-radius:14px; min-height:54px; padding:0 22px; font-size:17px; font-weight:600; }
 .primary { background:var(--accent); color:#06201d; border-color:var(--accent); }
 .row { display:flex; gap:10px; } input { flex:1; font:inherit; font-size:18px; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:14px; padding:0 16px; min-height:54px; outline:none; }
 input:focus { border-color:var(--accent); }
 .status { color:var(--amber); font-size:17px; min-height:24px; margin:-8px 0 16px; }
 .bar { height:6px; background:var(--panel2); border-radius:3px; overflow:hidden; margin-top:6px; } .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
 .muted { color:var(--muted); font-size:14px; line-height:1.5; }
 .spin { width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:s 1s linear infinite; }
 @keyframes s { to { transform:rotate(360deg); } }
</style></head>
<body><div class="wrap">
 <div class="logo"><svg viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#14171c"/><rect x="96" y="120" width="320" height="210" rx="26" fill="none" stroke="#4fd1c5" stroke-width="28"/><rect x="150" y="372" width="212" height="34" rx="17" fill="#f6ad55"/></svg>
  <div><h1>TabDock</h1><p>Док для вашего Mac</p></div></div>
 <div class="status" id="status"></div>
 <div class="card"><h2>Mac с TabDock в этой сети <span class="spin" id="spin"></span></h2>
  <div id="list"><div class="muted">Ищу… (Bonjour и опрос сети, до 20 секунд)</div></div>
  <div class="bar" id="bar"><i></i></div></div>
 <div class="card"><h2>Подключиться вручную</h2>
  <form class="row" id="manual"><input id="addr" placeholder="IP Mac, например 192.168.1.20" inputmode="decimal" autocomplete="off"><button class="primary">Открыть</button></form>
  <p class="muted">На Mac адрес показан во вкладке «Подключение». Порт по умолчанию 8787.</p></div>
 <p class="muted" id="ver"></p>
</div>
<script src="connect.js"></script>
<script>
"use strict";
const N = window.TabDockNative;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mode = location.hash.slice(1);           // "", "lost", "menu"
const servers = new Map();                     // base -> {name, base, src}
let touched = false, opened = false;
document.addEventListener("pointerdown", () => touched = true);
if (N) $("#ver").textContent = "Приложение TabDock " + N.version();

function open(base) { if (opened) return; opened = true; location.href = base.replace(/\/$/, "") + "/"; }
function render() {
  const items = [...servers.values()];
  $("#list").innerHTML = items.map((s) => `<div class="srv" data-b="${esc(s.base)}"><span class="dot"></span>
     <div class="n">${esc(s.name || s.base)}<small>${esc(s.base.replace("http://", ""))}${s.model ? " · " + esc(s.model) : ""}</small></div>
     <span class="src">${s.src}</span><button class="primary">Открыть</button></div>`).join("")
    || '<div class="muted">Пока никого не нашли. Проверьте, что Mac включён и TabDock запущен, или введите адрес ниже.</div>';
  document.querySelectorAll(".srv").forEach((el) => el.onclick = () => open(el.dataset.b));
}
function add(s, src) {
  const old = servers.get(s.base);
  servers.set(s.base, Object.assign({ src }, old || {}, s));
  render();
  maybeAuto();
}
function maybeAuto() {
  if (mode === "menu" || touched || opened) return;
  const saved = N ? N.saved() : "";
  if (saved && servers.has(saved)) return open(saved);
  if (!saved && servers.size === 1) setTimeout(() => { if (!touched && servers.size === 1) open([...servers.keys()][0]); }, 1500);
}

async function checkSaved() {
  const saved = N ? N.saved() : "";
  if (!saved) return;
  const r = await DockConnect.probe(saved, 2500);
  if (r) add(r, "последний");
}

// 1) last used Mac, 2) Bonjour via the app, 3) subnet probe like the web login page
if (N && N.saved()) $("#status").textContent = "Жду " + N.saved().replace("http://", "") + " — как только Mac появится в сети, панель откроется сама";
checkSaved();
setInterval(checkSaved, 4000);   // the last Mac comes back (reboot, Wi-Fi drop) -> reopen it by itself
setInterval(() => {
  if (!N) return;
  for (const s of JSON.parse(N.servers() || "[]")) {
    if (!servers.has(s.base)) DockConnect.probe(s.base, 2500).then((r) => { if (r) add(r, "Bonjour"); });
  }
}, 1000);
(async function scanLoop() {
  const extra = [];
  if (N) { extra.push(N.deviceIp()); const sv = N.saved(); if (sv) extra.push(new URL(sv).hostname); }
  await DockConnect.scan({ extraIps: extra, onFound: (s) => add(s, "сеть"),
    onProgress: (d, t) => { $("#bar i").style.width = (100 * d / t) + "%"; } });
  $("#spin").style.display = "none"; $("#bar").style.display = "none";
  render();
  // lost the last Mac and it did not come back -> switch to another TabDock (failover)
  const saved = N ? N.saved() : "";
  if (mode === "lost" && !touched && servers.size && !servers.has(saved)) open([...servers.keys()][0]);
})();

$("#manual").onsubmit = async (e) => {
  e.preventDefault(); touched = true;
  let a = $("#addr").value.trim().replace(/^https?:\/\//, "").replace(/\/.*$/, "");
  if (!a) return;
  if (!/:\d+$/.test(a)) a += ":8787";
  const base = "http://" + a;
  $("#status").textContent = "Проверяю " + a + "…";
  const r = await DockConnect.probe(base, 4000);
  if (r) { opened = false; open(base); } else $("#status").textContent = "По адресу " + a + " TabDock не отвечает";
};
render();
</script></body></html>
